<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport"content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Interaktivni Whiteboard</title>

</head>
<body>
    <h1>Interaktivni Whiteboard</h1>
    

    <div class="toolbar">
        <label for="colorPicker">Boja</label>
        <input type=color id="colorPicker"value="#000000">

        <label for="brushSize">Četka</label>
        <input type="range" id="brushSize" min="1" max="20" value="3">

        <button id="eraseBtn">Briši</button>
        <button id="clearBtn">Čista ploča</button>
        <button id="saveBtn">Snimi</button>
        <button id="pdfBtn">Snimi kao PDF</button>
    </div>

<!--drawing area-->
<canvas id="board" width="900" height="500"></canvas>

<footer>
    Web programiranje
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"> </script>
<script src="script.js"></script>
</body>
</html>
